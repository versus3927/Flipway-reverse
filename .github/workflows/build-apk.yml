name: Build Android APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'apk/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build web bundle
        run: |
          npm ci
          npm run build

      - name: Initialize Capacitor Android and build APK
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android capacitor.config.json capacitor.config.ts
          npx cap init "GRAVI-RAN" com.gravi.ran --web-dir=dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK output
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/gravi-ran-debug.apk
          ls -lh apk/gravi-ran-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravi-ran-debug-apk
          path: apk/gravi-ran-debug.apk

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/gravi-ran-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add built Android APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
